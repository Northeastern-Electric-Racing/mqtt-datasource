syntax = "proto3";

package serverdata.v2;

option go_package = "github.com/grafana/mqtt-datasource/pkg/protoc";

message ServerData {
  // ensure old type is reserved
  reserved 1;
  reserved "value";

  string unit = 2;
  // time since unix epoch in MICROSECONDS
  uint64 time_us = 3;
  repeated float values = 4;
}
